<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostlora Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1f2937;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container, .dashboard-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .dashboard-container {
            max-width: 800px;
            display: none;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .switch-mode {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #9ca3af;
        }

        .switch-mode span {
            color: var(--accent-color);
            cursor: pointer;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        /* Dashboard Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 8px;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .logout-btn {
            background-color: transparent;
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
        }

        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: #9ca3af;
            font-weight: 500;
        }

        .deposit-section {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .inline-form {
            display: flex;
            gap: 12px;
        }

        .inline-form input {
            flex: 1;
        }

        .inline-form button {
            width: auto;
            padding: 0 24px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER) -->
    <div class="auth-container" id="authBox">
        <h2 id="authTitle">Sign In to Boostlora</h2>
        <div class="message" id="authMessage"></div>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button id="authBtn" onclick="handleAuth()">Sign In</button>
        
        <div class="switch-mode" id="switchPrompt">
            Don't have an account? <span onclick="toggleAuthMode(true)">Register</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTAINER -->
    <div class="dashboard-container" id="dashboardBox">
        <div class="nav-header">
            <div>
                Welcome back, <strong id="userDisplay" style="color: var(--accent-color);">User</strong>!
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <label>Account Status</label>
                <div class="val" id="roleDisplay" style="font-size: 20px; text-transform: uppercase;">User</div>
            </div>
            <div class="stat-card">
                <label>Available Balance</label>
                <div class="val" id="balanceDisplay">$0.00</div>
            </div>
        </div>

        <!-- DEPOSIT MANAGEMENT SECTION -->
        <div class="deposit-section">
            <h3 style="margin-top:0; font-size: 18px; margin-bottom: 16px;">Log a New Deposit</h3>
            <div class="inline-form">
                <input type="number" id="depositAmount" placeholder="Enter amount in USD ($)" min="1" step="any">
                <button onclick="addDeposit()">Submit Deposit</button>
            </div>
        </div>

        <h3>Your Deposit History</h3>
        <table>
            <thead>
                <tr>
                    <th>Date / Time</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="depositTableBody">
                <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>

    <script>
        let isRegisterMode = false;
        let currentUser = null;

        function toggleAuthMode(register) {
            isRegisterMode = register;
            const authTitle = document.getElementById('authTitle');
            const authBtn = document.getElementById('authBtn');
            const switchPrompt = document.getElementById('switchPrompt');
            const authMessage = document.getElementById('authMessage');
            
            authMessage.className = "message";
            authMessage.style.display = "none";

            if (isRegisterMode) {
                authTitle.innerText = "Create Your Account";
                authBtn.innerText = "Register";
                switchPrompt.innerHTML = 'Already have an account? <span onclick="toggleAuthMode(false)">Sign In</span>';
            } else {
                authTitle.innerText = "Sign In to Boostlora";
                authBtn.innerText = "Sign In";
                switchPrompt.innerHTML = 'Don\'t have an account? <span onclick="toggleAuthMode(true)">Register</span>';
            }
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const authMessage = document.getElementById('authMessage');

            if (!username || !password) {
                authMessage.className = "message error";
                authMessage.innerText = "Please fill out all fields.";
                return;
            }

            const endpoint = isRegisterMode ? '/api/submit/register' : '/api/submit/login';
            
            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: username, password: password })
                });

                const data = await response.json();

                if (!response.ok) {
authMessage.className = "message error";
authMessage.innerText = data.error || "Authentication failed.";
return;
}
if (isRegisterMode) {
authMessage.className = "message success";
authMessage.innerText = "Account registered successfully! Switching to sign in...";
setTimeout(() => {
toggleAuthMode(false);
}, 2000);
} else {
currentUser = data;
showDashboard();
}
} catch (err) {
authMessage.className = "message error";
authMessage.innerText = "Server error. Could not connect to API endpoints.";
console.error(err);
}
}
async function showDashboard() {
if (!currentUser) return;
document.getElementById('authBox').style.display = 'none';
document.getElementById('dashboardBox').style.display = 'block';
document.getElementById('userDisplay').innerText = currentUser.username;
document.getElementById('roleDisplay').innerText = currentUser.role;
try {
const response = await fetch(/api/submit/dashboard?userId=${currentUser.userId}&role=${currentUser.role});
const data = await response.json();
if (response.ok) {
if (data.role === 'admin') {
document.getElementById('balanceDisplay').innerText = "Admin Account";
renderDepositsTable(data.allDeposits || []);
} else {
document.getElementById('balanceDisplay').innerText = $${data.balance.toFixed(2)};
renderDepositsTable(data.myDeposits || []);
}
}
} catch (err) {
console.error("Error pulling profile updates:", err);
}
}
function renderDepositsTable(deposits) {
const tbody = document.getElementById('depositTableBody');
tbody.innerHTML = '';
if (deposits.length === 0) {
tbody.innerHTML = 'No deposits logged.';
return;
}
deposits.forEach(d => {
const row = document.createElement('tr');
const date = d.created_at ? new Date(d.created_at).toLocaleString() : 'N/A';
row.innerHTML = `
${date}
$${d.amount.toFixed(2)}
${d.status || 'pending'}
`;
tbody.appendChild(row);
});
}
function logout() {
currentUser = null;
document.getElementById('dashboardBox').style.display = 'none';
document.getElementById('authBox').style.display = 'block';
document.getElementById('username').value = '';
document.getElementById('password').value = '';
toggleAuthMode(false);
}
function addDeposit() {
alert("Deposit configuration requires backend integration.");
}
