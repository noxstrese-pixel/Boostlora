<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostlora Central Nexus</title>
    <style>
        :root {
            --bg-main: #090D16;
            --bg-sidebar: #0F1626;
            --bg-card: #151D30;
            --bg-input: #0b1220;
            --accent-blue: #3B82F6;
            --accent-hover: #2563EB;
            --text-main: #F3F4F6;
            --text-muted: #9CA3AF;
            --border-color: #1F293D;
            --color-valid: #10B981;
            --color-warning: #F59E0B;
            --color-invalid: #EF4444;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
        }

        /* Mount Master Node Wrap Container */
        #app-mount-root {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .sidebar {
            width: 240px;
            flex: 0 0 240px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-brand {
            font-size: 22px;
            font-weight: 800;
            padding: 0 12px 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
            background: linear-gradient(to right, #60A5FA, #3B82F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-btn {
            background: none;
            border: 0;
            color: var(--text-muted);
            padding: 12px;
            border-radius: 8px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            width: 100%;
        }

        .nav-btn.active { background: var(--accent-blue); color: white; }
        .nav-btn:hover:not(.active) { background: #1E293B; color: var(--text-main); }

        .badge-dev {
            float: right;
            font-size: 10px;
            background: rgba(245,158,11,.2);
            color: #FBBF24;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .dashboard-container {
            width: 100%;
            max-width: 750px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,.3);
        }

        .tool-panel { display: none; }
        .tool-panel.active { display: block; }
        .header-section { margin-bottom: 28px; }

        h2 { margin: 0 0 8px; font-size: 24px; }
        p.subtitle { margin: 0; color: var(--text-muted); font-size: 14px; }

        textarea, .n-input {
            width: 100%;
            background: var(--bg-main);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            outline: none;
        }
        textarea { min-height: 140px; font-family: monospace; resize: vertical; margin-bottom: 15px; }
        textarea:focus, .n-input:focus { border-color: var(--accent-blue); }

        .action-btn {
            width: 100%;
            background: var(--accent-blue);
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background .2s;
        }

        .action-btn:hover { background: var(--accent-hover); }

        /* Wallet Core Component Box Structures */
        .sidebar-wallet {
            margin-top: auto;
            background: var(--bg-main);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .wallet-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); font-weight: 700; }
        .wallet-amount { font-size: 20px; font-weight: 700; color: var(--color-valid); }
        .wallet-btn { width: 100%; background: var(--accent-blue); color: #fff; font-size: 12px; font-weight: 600; padding: 10px; border: 0; border-radius: 6px; cursor: pointer; }
        .wallet-btn-logout { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); width: 100%; font-size: 11px; padding: 6px; border-radius: 6px; cursor: pointer; }
        .wallet-btn-logout:hover { background: var(--color-invalid); color: #fff; border-color: var(--color-invalid); }

        /* Authentication View Screen Matrix */
        .n-auth-screen { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 100vh; background: var(--bg-main); }
        .n-auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        /* Modal Layer Blueprint */
        .n-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(4, 7, 12, 0.85); backdrop-filter: blur(8px); align-items: center; justify-content: center; z-index: 99999; }
        .n-modal-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 24px; padding: 32px; max-width: 460px; width: 100%; text-align: center; position: relative; }
        .n-modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; }
        .n-address-container { background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 8px; font-family: monospace; font-size: 12px; padding: 14px; margin: 16px 0; color: var(--text-muted); word-break: break-all; user-select: all; text-align: center; }
        .n-badge-status { display: inline-flex; align-items: center; gap: 8px; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); color: var(--color-warning); padding: 8px 20px; border-radius: 9999px; font-size: 13px; font-weight: 600; }
        .n-badge-status.confirmed { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); color: var(--color-valid); }
        .spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Store Catalog Grid Styling Module */
        .store-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-top: 24px; }
        .store-card { background: var(--bg-main); border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; display: flex; flex-direction: column; justify-content: space-between; }
        .store-title { font-size: 14px; font-weight: 700; margin: 0 0 6px 0; color: #fff; }
        .store-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; margin: 0 0 12px 0; }
        .store-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .store-price { font-size: 14px; font-weight: 700; color: var(--color-valid); }
        .store-btn { background: var(--bg-sidebar); border: 1px solid var(--border-color); color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .store-btn:hover { background: var(--accent-blue); border-color: var(--accent-blue); }

        @media (max-width: 700px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; flex-basis: auto; padding: 12px; flex-direction: row; flex-wrap: wrap; }
            .sidebar-brand { width: 100%; padding-bottom: 12px; margin-bottom: 4px; }
            .content-area { padding: 16px; }
            .dashboard-container { padding: 22px; }
            .sidebar-wallet { width: 100%; margin-top: 10px; }
        }
    </style>
</head>
<body>

    <!-- Native Mount Root Block Grid -->
    <div id="app-mount-root">
        <div style="padding: 40px; text-align: center; width: 100%; color: var(--text-muted);">
            Connecting to application subsystem vectors...
        </div>
    </div>

    <!-- Standalone System Runtime Script Logic Asset -->
    <script src="boost.js"></script>
</body>
</html>
