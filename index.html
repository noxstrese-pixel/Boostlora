<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostlora Dashboard</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .dash-box { max-width: 900px; width: 100%; display: none; }
        h2, h3 { margin-top: 0; text-align: center; }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px; font-weight: 500; }
        input, textarea, select { width: 100%; padding: 12px; background: #0b0f19; border: 1px solid #1f2937; border-radius: 6px; color: white; box-sizing: border-box; font-size: 15px; }
        input:focus, textarea:focus, select:focus { outline: none; border-color: #3b82f6; }
        textarea { resize: vertical; min-height: 80px; font-family: monospace; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
        button:hover { background: #2563eb; }
        .btn-alt { background: transparent; border: 1px solid #ef4444; color: #ef4444; width: auto; padding: 6px 12px; }
        .btn-alt:hover { background: rgba(239, 68, 68, 0.1); }
        .prompt { text-align: center; font-size: 14px; color: #9ca3af; margin-top: 16px; }
        .prompt span { color: #3b82f6; cursor: pointer; }
        .msg { padding: 10px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; text-align: center; display: none; }
        .error { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); display: block; }
        .success { background: rgba(16,185,129,0.1); color: #10b981; border: 1px solid rgba(16,185,129,0.2); display: block; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
        .grid-main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #0b0f19; border: 1px solid #1f2937; padding: 18px; border-radius: 8px; }
        .center-card { text-align: center; }
        .val { font-size: 24px; font-weight: bold; color: #3b82f6; margin-top: 6px; }
        .flex-row { display: flex; gap: 12px; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2937; padding-bottom: 12px; margin-bottom: 20px; }
        .inline-form { display: flex; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #1f2937; font-size: 14px; }
        th { color: #9ca3af; }
        .log-stream { background: #05070f; border: 1px solid #1f2937; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 13px; height: 180px; overflow-y: auto; color: #34d399; white-space: pre-wrap; }
    </style>
</head>
<body>

    <!-- AUTHENTICATION FORM -->
    <div id="authBox" class="box">
        <h2 id="authTitle">Sign In to Boostlora</h2>
        <div id="authMessage" class="msg"></div>
        
        <div class="input-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button id="authBtn" onclick="handleAuth()">Sign In</button>
        <div id="switchPrompt" class="prompt">
            Don't have an account? <span onclick="toggleAuthMode(true)">Register</span>
        </div>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="dashboardBox" class="box dash-box">
        <div class="flex-row">
            <div>Welcome back, <strong id="userDisplay" style="color:#3b82f6;">User</strong>!</div>
            <button class="btn-alt" onclick="logout()">Logout</button>
        </div>

        <div class="grid-2">
            <div class="card center-card">
                <label>Account Status</label>
                <div id="roleDisplay" class="val" style="text-transform: uppercase; font-size: 18px;">User</div>
            </div>
            <div class="card center-card">
                <label>Available Balance</label>
                <div id="balanceDisplay" class="val">$0.00</div>
            </div>
        </div>

        <!-- MAIN UTILITY HUB WORKSPACE -->
        <div class="grid-main">
            <!-- LEFT WORKSPACE COLUMN: PIPELINE CONTROLS -->
            <div class="card">
                <h3 style="text-align: left; font-size: 18px; margin-bottom: 16px; color:#3b82f6;">Discord Server Joiner Hub</h3>
                <div id="pipelineMessage" class="msg"></div>
                
                <div class="input-group">
                    <label>Server Invite Code / Link</label>
                    <input type="text" id="inviteCode" placeholder="ex: boostlora or https://discord.gg">
                </div>
                
                <div class="grid-2" style="margin: 0 0 16px 0;">
                    <div>
                        <label>Member Allocation Count</label>
                        <input type="number" id="joinAmount" value="50" min="1">
                    </div>
                    <div>
                        <label>Execution Mode</label>
                        <select id="executionMode" onchange="toggleCustomTokensField()">
                            <option value="stock">Stock Profiles</option>
                            <option value="byot">Custom (BYOT Tokens)</option>
                        </select>
                    </div>
                </div>

                <div class="input-group id="customTokensGroup" style="display:none; margin-bottom: 16px;">
                    <label>Paste Custom User Tokens (One Per Line)</label>
                    <textarea id="customTokens" placeholder="MTg0...&#10;NDI1..."></textarea>
                </div>

                <button onclick="executePipeline()">Fire Execution Routine</button>
            </div>

            <!-- RIGHT WORKSPACE COLUMN: TRANSACTIONAL STATS & DEPOSITS -->
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <div class="card">
                    <h3 style="text-align: left; font-size: 16px; margin-bottom: 12px;">Log a New Deposit</h3>
                    <div class="inline-form">
                        <input type="number" id="depositAmount" placeholder="USD ($)" min="1" step="any">
                        <button onclick="addDeposit()" style="width: auto; padding: 0 16px;">Submit</button>
                    </div>
                </div>

                <div class="card">
                    <h3 style="text-align: left; font-size: 16px; margin-bottom: 8px;">Real-Time Pipeline Logs</h3>
                    <div id="logStreamOutput" class="log-stream">[System] Console online. Waiting for pipeline parameters execution instructions...</div>
                </div>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h3 style="text-align: left; font-size: 16px;">Your Transaction Records</h3>
            <table>
                <thead>
                    <tr><th>Date / Time</th><th>Amount</th><th>Status</th></tr>
                </thead>
                <tbody id="depositTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let isRegisterMode = false, currentUser = null;

        function toggleAuthMode(register) {
            isRegisterMode = register;
            const msg = document.getElementById('authMessage');
            msg.style.display = "none";
            document.getElementById('authTitle').innerText = register ? "Create Your Account" : "Sign In to Boostlora";
            document.getElementById('authBtn').innerText = register ? "Register" : "Sign In";
            document.getElementById('switchPrompt').innerHTML = register ? 
                'Already have an account? <span onclick="toggleAuthMode(false)">Sign In</span>' :
                'Don\'t have an account? <span onclick="toggleAuthMode(true)">Register</span>';
        }

        function toggleCustomTokensField() {
            const mode = document.getElementById('executionMode').value;
            document.getElementById('customTokensGroup').style.display = mode === 'byot' ? 'block' : 'none';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('authMessage');
            if (!username || !password) {
                msg.className = "msg error"; msg.innerText = "Please fill out all fields."; return;
            }
            try {
                const res = await fetch(isRegisterMode ? '/api/submit/register' : '/api/submit/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    msg.className = "msg error"; msg.innerText = data.error || "Authentication failed."; return;
                }
                if (isRegisterMode) {
                    msg.className = "msg success"; msg.innerText = "Registered successfully! Switching to sign in...";
                    setTimeout(() => toggleAuthMode(false), 2000);
                } else {
