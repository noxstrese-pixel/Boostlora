<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostlora Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --container-bg: #111827;
            --text-color: #f3f4f6;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #1f2937;
            --error-color: #ef4444;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container, .dashboard-container {
            background-color: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .dashboard-container {
            max-width: 800px;
            display: none;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            text-align: center;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #9ca3af;
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .switch-mode {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #9ca3af;
        }

        .switch-mode span {
            color: var(--accent-color);
            cursor: pointer;
        }

        .message {
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: center;
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--error-color);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: block;
        }

        .message.success {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--success-color);
            border: 1px solid rgba(16, 185, 129, 0.2);
            display: block;
        }

        /* Dashboard Styles */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 32px;
        }

        .stat-card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-card .val {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 8px;
        }

        .nav-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            margin-bottom: 24px;
        }

        .logout-btn {
            background-color: transparent;
            border: 1px solid var(--error-color);
            color: var(--error-color);
            padding: 6px 12px;
            font-size: 14px;
            width: auto;
        }

        .logout-btn:hover {
            background-color: rgba(239, 68, 68, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: #9ca3af;
            font-weight: 500;
        }

        .deposit-section {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }

        .inline-form {
            display: flex;
            gap: 12px;
        }

        .inline-form input {
            flex: 1;
        }

        .inline-form button {
            width: auto;
            padding: 0 24px;
        }
    </style>
</head>
<body>

    <!-- AUTHENTICATION CONTAINER (LOGIN / REGISTER) -->
    <div class="auth-container" id="authBox">
        <h2 id="authTitle">Sign In to Boostlora</h2>
        <div class="message" id="authMessage"></div>
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username">
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter password">
        </div>
        
        <button id="authBtn" onclick="handleAuth()">Sign In</button>
        
        <div class="switch-mode" id="switchPrompt">
            Don't have an account? <span onclick="toggleAuthMode(true)">Register</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD CONTAINER -->
    <div class="dashboard-container" id="dashboardBox">
        <div class="nav-header">
            <div>
                Welcome back, <strong id="userDisplay" style="color: var(--accent-color);">User</strong>!
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <label>Account Status</label>
                <div class="val" id="roleDisplay" style="font-size: 20px; text-transform: uppercase;">User</div>
            </div>
            <div class="stat-card">
                <label>Available Balance</label>
                <div class="val" id="balanceDisplay">$0.00</div>
            </div>
        </div>

        <!-- DEPOSIT MANAGEMENT SECTION -->
        <div class="deposit-section">
            <h3 style="margin-top:0; font-size: 18px; margin-bottom: 16px;">Log a New Deposit</h3>
            <div class="inline-form">
                <input type="number" id="depositAmount" placeholder="Enter amount in USD ($)" min="1" step="any">
                <button onclick="addDeposit()">Submit Deposit</button>
            </div>
        </div>

        <h3>Your Deposit History</h3>
        <table>
            <thead>
                <tr>
                    <th>Date / Time</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="depositTableBody">
                <!-- Data injected dynamically -->
            </tbody>
        </table>
    </div>
    <script>
        let isRegisterMode = false;
        let currentUser = null;

        // --- SALTA7 INTEGRATION CONFIGURATION ---
        const SALTA7_BASE_URL = "https://salta7.store";
        const SALTA7_HEADERS = {
            "Authorization": "Bearer FWG7PJY53V4PLHI1TED5C7SYFNOBYQW5",
            "Content-Type": "application/json"
        };

        // Check if a session already exists on page load
        window.onload = function() {
            const loggedInUser = localStorage.getItem('logged_in_session');
            if (loggedInUser) {
                loadDashboard(loggedInUser);
            }
        };

        function toggleAuthMode(toRegister) {
            isRegisterMode = toRegister;
            const title = document.getElementById('authTitle');
            const btn = document.getElementById('authBtn');
            const prompt = document.getElementById('switchPrompt');
            const msg = document.getElementById('authMessage');
            
            msg.className = "message";
            msg.innerText = "";

            if (isRegisterMode) {
                title.innerText = "Create Your Account";
                btn.innerText = "Register Account";
                prompt.innerHTML = 'Already have an account? <span onclick="toggleAuthMode(false)">Sign In</span>';
            } else {
                title.innerText = "Sign In to Boostlora";
                btn.innerText = "Sign In";
                prompt.innerHTML = 'Don\'t have an account? <span onclick="toggleAuthMode(true)">Register</span>';
            }
        }

        function handleAuth() {
            const userInp = document.getElementById('username').value.trim();
            const passInp = document.getElementById('password').value.trim();
            const msg = document.getElementById('authMessage');

            if (!userInp || !passInp) {
                msg.className = "message error";
                msg.innerText = "Please complete all validation fields.";
                return;
            }

            let users = JSON.parse(localStorage.getItem('app_users')) || {};

            if (isRegisterMode) {
                if (users[userInp.toLowerCase()]) {
                    msg.className = "message error";
                    msg.innerText = "Username is already registered.";
                    return;
                }

                const isFirstUser = Object.keys(users).length === 0;

                users[userInp.toLowerCase()] = {
                    username: userInp,
                    password: passInp,
                    role: isFirstUser ? 'admin' : 'user',
                    balance: 0.00,
                    deposits: []
                };

                localStorage.setItem('app_users', JSON.stringify(users));
                msg.className = "message success";
                msg.innerText = "Registration complete! Switching to login window...";
                
                setTimeout(() => {
                    toggleAuthMode(false);
                    document.getElementById('password').value = "";
                }, 1500);

            } else {
                const matchedUser = users[userInp.toLowerCase()];
                if (!matchedUser || matchedUser.password !== passInp) {
                    msg.className = "message error";
                    msg.innerText = "Invalid security credentials matched.";
                    return;
                }

                localStorage.setItem('logged_in_session', userInp.toLowerCase());
                loadDashboard(userInp.toLowerCase());
            }
        }

        function loadDashboard(usernameKey) {
            const users = JSON.parse(localStorage.getItem('app_users')) || {};
            currentUser = users[usernameKey];

            if (!currentUser) {
                logout();
                return;
            }

            document.getElementById('authBox').style.display = 'none';
            document.getElementById('dashboardBox').style.display = 'block';
            
            document.getElementById('userDisplay').innerText = currentUser.username;
            document.getElementById('roleDisplay').innerText = currentUser.role;
            document.getElementById('balanceDisplay').innerText = `$${parseFloat(currentUser.balance).toFixed(2)}`;

            renderDeposits();
        }

        function renderDeposits() {
            const tbody = document.getElementById('depositTableBody');
            tbody.innerHTML = "";

            if (!currentUser.deposits || currentUser.deposits.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#6b7280;">No logged deposits recorded yet.</td></tr>`;
                return;
            }

            const chronologicalList = [...currentUser.deposits].reverse();

            chronologicalList.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.date}</td>
                    <td style="font-weight:600; color: var(--success-color);">$${parseFloat(item.amount).toFixed(2)}</td>
                    <td><span style="background-color: rgba(16, 185, 129, 0.1); color: var(--success-color); padding: 4px 8px; border-radius:4px; font-size:12px;">Completed</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addDeposit() {
            const amtInp = document.getElementById('depositAmount');
            const val = parseFloat(amtInp.value);

            if (isNaN(val) || val <= 0) {
                alert("Please enter a valid currency value higher than 0.");
                return;
            }

            const newTransaction = {
                date: new Date().toLocaleString(),
                amount: val
            };

            currentUser.deposits.push(newTransaction);
            currentUser.balance = parseFloat(currentUser.balance) + val;

            let users = JSON.parse(localStorage.getItem('app_users'));
            users[localStorage.getItem('logged_in_session')] = currentUser;
            localStorage.setItem('app_users', JSON.stringify(users));

            document.getElementById('balanceDisplay').innerText = `$${parseFloat(currentUser.balance).toFixed(2)}`;
            amtInp.value = "";
            renderDeposits();
        }

        // =====================================================================
        // CORE PIPELINES (JOINER / BOOSTER ACTIONS RUNNING DIRECTLY FROM CLIENT)
        // =====================================================================
        
        async function runJoinerPipeline(inviteCode, joinAmount, customTokensRaw) {
            try {
                if (!inviteCode) {
                    return { status: "error", logs: ["[Error] Target server invite parameter code is missing."] };
                }

                const totalMembers = parseInt(joinAmount) || 50;
                const costPerUnit = 0.09;
                const totalCost = currentUser.role === 'admin' ? 0.00 : (totalMembers * costPerUnit);
                let currentBalance = parseFloat(currentUser.balance);

                if (currentBalance < totalCost) {
                    return { status: "error", logs: [`❌ [Insufficient Funds] Balance: $${currentBalance.toFixed(2)} USD | Required: $${totalCost.toFixed(2)} USD`] };
                }

                // Build Salta7 Payload Configuration
                let payload = { tool: "join", invite: inviteCode };
                let tokensList = customTokensRaw ? customTokensRaw.split('\n').map(t => t.trim()).filter(Boolean) : [];
                let logsInitial = "";

                if (tokensList.length > 0) {
                    payload.mode = "byot";
                    payload.tokens = tokensList;
                    logsInitial = `[System] Initializing BYOT Joiner: Injecting ${tokensList.length} custom profiles...`;
                } else {
                    payload.mode = "stock";
                    payload.product = "discord";
                    payload.quantity = totalMembers;
                    logsInitial = `[System] Initializing Stock Joiner: Requesting ${payload.quantity} accounts...`;
                }

                // Send request out to Salta7 Store Endpoints via client fetch
                const response = await fetch(`${SALTA7_BASE_URL}/task/create`, {
                    method: 'POST',
                    headers: SALTA7_HEADERS,
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    return { status: "error", logs: ["❌ [Salta7 Validation Failure] Connection Refused"] };
                }

                const responseData = await response.json();
                const jobId = responseData.job_id;

                // Deduct balance locally if not an admin account
                if (totalCost > 0) {
                    currentUser.balance = currentBalance - totalCost;
                    let users = JSON.parse(localStorage.getItem('app_users'));
                    users[localStorage.getItem('logged_in_session')] = currentUser;
                    localStorage.setItem('app_users', JSON.stringify(users));
                    document.getElementById('balanceDisplay').innerText = `$${currentUser.balance.toFixed(2)}`;
                }

                let outputLogs = [`[Ledger] Deducted: $${totalCost.toFixed(2)} USD.`, logsInitial, `✅ [Task Started] Job ID: ${jobId}`];
                return { status: "success", logs: outputLogs, jobId: jobId };

            } catch (err) {
                return { status: "error", logs: [`[Fatal Error]: ${err.message}`] };
            }
        }

        function logout() {
            localStorage.removeItem('logged_in_session');
            currentUser = null;
            document.getElementById('username').value = "";
document.getElementById('password').value = "";
document.getElementById('authBox').style.display = 'block';
document.getElementById('dashboardBox').style.display = 'none';
toggleAuthMode(false);
}
