<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boostlora Dashboard</title>
    <!-- Tailwind CSS CDN for compact layout rules -->
    <script src="https://tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { darkbg: '#0b0f19', boxbg: '#111827', accent: '#3b82f6', bordercl: '#1f2937' } } }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <!-- AUTHENTICATION BOX (LOGIN / REGISTER) -->
    <div id="authBox" class="bg-boxbg border border-bordercl rounded-xl p-8 w-full max-w-md shadow-2xl">
        <h2 id="authTitle" class="text-2xl font-bold text-center mb-6">Sign In to Boostlora</h2>
        <div id="authMessage" class="hidden p-3 rounded mb-4 text-sm text-center"></div>
        
        <div class="mb-4">
            <label class="block text-gray-400 text-sm mb-2">Username</label>
            <input type="text" id="username" placeholder="Enter username" class="w-full p-3 bg-darkbg border border-bordercl rounded text-white focus:outline-none focus:border-accent">
        </div>
        <div class="mb-6">
            <label class="block text-gray-400 text-sm mb-2">Password</label>
            <input type="password" id="password" placeholder="Enter password" class="w-full p-3 bg-darkbg border border-bordercl rounded text-white focus:outline-none focus:border-accent">
        </div>
        
        <button id="authBtn" onclick="handleAuth()" class="w-full p-3 bg-accent hover:bg-blue-600 font-semibold rounded transition">Sign In</button>
        <div id="switchPrompt" class="text-center text-gray-400 text-sm mt-4">
            Don't have an account? <span onclick="toggleAuthMode(true)" class="text-accent cursor-pointer">Register</span>
        </div>
    </div>

    <!-- MAIN DASHBOARD -->
    <div id="dashboardBox" class="hidden bg-boxbg border border-bordercl rounded-xl p-8 w-full max-w-3xl shadow-2xl">
        <div class="flex justify-between items-center border-b border-bordercl pb-4 mb-6">
            <div>Welcome back, <strong id="userDisplay" class="text-accent">User</strong>!</div>
            <button onclick="logout()" class="border border-red-500 text-red-500 hover:bg-red-500/10 px-3 py-1 text-sm rounded transition">Logout</button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-darkbg border border-bordercl rounded p-5 text-center">
                <label class="text-gray-400 text-sm">Account Status</label>
                <div id="roleDisplay" class="text-xl font-bold text-accent uppercase mt-2">User</div>
            </div>
            <div class="bg-darkbg border border-bordercl rounded p-5 text-center">
                <label class="text-gray-400 text-sm">Available Balance</label>
                <div id="balanceDisplay" class="text-2xl font-bold text-accent mt-2">\$0.00</div>
            </div>
        </div>

        <div class="bg-darkbg border border-bordercl rounded p-5 mb-6">
            <h3 class="text-lg mb-4">Log a New Deposit</h3>
            <div class="flex gap-3">
                <input type="number" id="depositAmount" placeholder="Amount in USD (\$)" min="1" step="any" class="flex-1 p-3 bg-boxbg border border-bordercl rounded text-white focus:outline-none focus:border-accent">
                <button onclick="addDeposit()" class="bg-accent hover:bg-blue-600 px-6 rounded font-semibold transition">Submit</button>
            </div>
        </div>

        <h3 class="text-lg mb-4">Your Deposit History</h3>
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="text-gray-400 border-b border-bordercl"><th class="pb-3">Date / Time</th><th class="pb-3">Amount</th><th class="pb-3">Status</th></tr>
            </thead>
            <tbody id="depositTableBody"></tbody>
        </table>
    </div>

    <script>
        let isRegisterMode = false, currentUser = null;

        function toggleAuthMode(register) {
            isRegisterMode = register;
            const msg = document.getElementById('authMessage');
            msg.className = "hidden p-3 rounded mb-4 text-sm text-center";
            
            document.getElementById('authTitle').innerText = register ? "Create Your Account" : "Sign In to Boostlora";
            document.getElementById('authBtn').innerText = register ? "Register" : "Sign In";
            document.getElementById('switchPrompt').innerHTML = register ? 
                'Already have an account? <span onclick="toggleAuthMode(false)" class="text-accent cursor-pointer">Sign In</span>' :
                'Don\'t have an account? <span onclick="toggleAuthMode(true)" class="text-accent cursor-pointer">Register</span>';
        }

        async function handleAuth() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('authMessage');

            if (!username || !password) {
                msg.className = "p-3 rounded mb-4 text-sm text-center bg-red-500/10 text-red-400 border border-red-500/20";
                msg.innerText = "Please fill out all fields.";
                return;
            }

            try {
                const res = await fetch(isRegisterMode ? '/api/submit/register' : '/api/submit/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (!res.ok) {
                    msg.className = "p-3 rounded mb-4 text-sm text-center bg-red-500/10 text-red-400 border border-red-500/20";
                    msg.innerText = data.error || "Authentication failed.";
                    return;
                }

                if (isRegisterMode) {
                    msg.className = "p-3 rounded mb-4 text-sm text-center bg-green-500/10 text-green-400 border border-green-500/20";
                    msg.innerText = "Registered successfully! Switching to sign in...";
                    setTimeout(() => toggleAuthMode(false), 2000);
                } else {
                    currentUser = data;
                    showDashboard();
                }
            } catch (err) {
                msg.className = "p-3 rounded mb-4 text-sm text-center bg-red-500/10 text-red-400 border border-red-500/20";
                msg.innerText = "Connection error to API server endpoints.";
            }
        }

        async function showDashboard() {
            if (!currentUser) return;
            document.getElementById('authBox').classList.add('hidden');
            document.getElementById('dashboardBox').classList.remove('hidden');
            document.getElementById('userDisplay').innerText = currentUser.username;
            document.getElementById('roleDisplay').innerText = currentUser.role;

            try {
                const res = await fetch(`/api/submit/dashboard?userId=${currentUser.userId}&role=${currentUser.role}`);
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('balanceDisplay').innerText = data.role === 'admin' ? "Admin Account" : `$${data.balance.toFixed(2)}`;
                    renderDepositsTable(data.role === 'admin' ? data.allDeposits : data.myDeposits);
                }
            } catch (err) { console.error(err); }
        }

        function renderDepositsTable(deposits = []) {
            const tbody = document.getElementById('depositTableBody');
            tbody.innerHTML = deposits.length === 0 ? '<tr><td colspan="3" class="text-center text-gray-500 pt-4">No deposits found.</td></tr>' : '';
            
            deposits.forEach(d => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-bordercl text-sm";
                tr.innerHTML = `
                    <td class="py-3">${d.created_at ? new Date(d.created_at).toLocaleString() : 'N/A'}</td>
                    <td class="py-3">$${d.amount.toFixed(2)}</td>
                    <td class="py-3 ${d.status === 'completed' ? 'text-green-400' : 'text-orange-400'}">${d.status || 'pending'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function logout() {
            currentUser = null;
            document.getElementById('dashboardBox').classList.add('hidden');
            document.getElementById('authBox').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            toggleAuthMode(false);
        }

        function addDeposit() { alert("Deposit tracker integration required."); }
    </script>
</body>
</html>
