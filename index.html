<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostLora Hub</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Clerk Authentication Engine (Swap out key in your dashboard) -->
    <script async crossorigin="anonymous" src="https://jsdelivr.net" 
            data-clerk-publishable-key="your-clerk-publishable-key" id="clerk-script"></script>

    <style>
        :root {
            --bg-base: #060b13;
            --bg-card: #0d1527;
            --bg-input: #050811;
            --border-color: #1a2642;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-green: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; }

        /* Sidebar Panel Layout */
        .sidebar {
            width: 260px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
        }
        .brand-section { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; margin-bottom: 32px; }
        .brand-icon { color: var(--accent-blue); }
        .status-dot { background-color: var(--accent-green); width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        
        .nav-menu { display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px;
            color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active { background-color: #111a30; color: var(--text-main); }
        .nav-item i { width: 18px; text-align: center; }

        /* Main Workspace Container */
        .main-content { margin-left: 260px; flex-grow: 1; padding: 32px; display: flex; flex-direction: column; gap: 24px; }
        
        /* Top Utility Navbar */
        .top-navbar {
            background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 12px 24px; display: flex; justify-content: flex-end; align-items: center; gap: 12px;
        }
        .user-balance { background-color: #16223f; border: 1px solid var(--border-color); font-size: 13px; padding: 8px 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; }

        /* App View Components */
        .view-panel { display: none; }
        .view-panel.active { display: block; }
        
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 24px; height: max-content; }
        .card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        /* Form Components */
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; }
        input, select, textarea { width: 100%; background-color: var(--bg-input); border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; color: var(--text-main); font-size: 14px; outline: none; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent-blue); }
        textarea { resize: vertical; min-height: 120px; font-family: monospace; }
        
        .btn-action { width: 100%; background-color: var(--accent-blue); color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: background 0.2s; }
        .btn-action:hover { background-color: #3b82f6; }

        /* Tools Service Grid Layout */
        .service-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .service-item { background: linear-gradient(135deg, #0f1930 0%, #0a1122 100%); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; text-align: center; }
        .price-tag { color: var(--accent-green); font-weight: 700; margin: 6px 0 16px 0; font-size: 15px; }

        /* Payment Selector Row */
        .crypto-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
        .crypto-box { background-color: var(--bg-input); border: 1px solid var(--border-color); padding: 10px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: 600; color: var(--text-muted); }
        .crypto-box i { display: block; font-size: 16px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- Left Navigation Bar Panel -->
    <div class="sidebar">
        <div class="brand-section">
            <i class="fa-solid fa-bolt brand-icon"></i>
            <span>BoostLora Hub</span>
            <span class="status-dot"></span>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="switchView('dashboard')"><i class="fa-solid fa-chart-pie"></i>Dashboard</div>
            <div class="nav-item" onclick="switchView('checker')"><i class="fa-solid fa-shield-halved"></i>Token Checker</div>
            <div class="nav-item" onclick="switchView('booster')"><i class="fa-solid fa-rocket"></i>Boost Tool</div>
            <div class="nav-item" onclick="switchView('joiner')"><i class="fa-solid fa-right-to-bracket"></i>Server Joiner</div>
        </div>
    </div>

    <!-- Main Workspace Area Layout -->
    <div class="main-content">
        <div class="top-navbar">
            <div class="user-balance"><i class="fa-solid fa-wallet"></i> 0.00 USD</div>
            <div id="auth-buttons">
                <button id="sign-in-btn" class="nav-item" style="padding: 8px 14px; background: #16223f;"><i class="fa-solid fa-user"></i>Connect</button>
            </div>
            <div id="user-profile-slot"></div>
        </div>

        <!-- VIEW 1: MAIN DASHBOARD & DEPOSITS -->
        <div id="view-dashboard" class="view-panel active">
            <div class="dashboard-grid">
                <div class="card">
                    <h3>Active Infrastructure Modules</h3>
                    <div class="service-grid">
                        <div class="service-item">
                            <h4>Discord Boost Module</h4>
                            <div class="price-tag">$2.50 / boost</div>
                            <button class="btn-action" style="padding: 8px;" onclick="switchView('booster')">Open Tool</button>
                        </div>
                        <div class="service-item">
                            <h4>Automated Server Joiner</h4>
                            <div class="price-tag">$4.00 / 100 members</div>
                            <button class="btn-action" style="padding: 8px;" onclick="switchView('joiner')">Open Tool</button>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <h3><i class="fa-solid fa-wallet" style="color: var(--accent-blue);"></i> Add Funds</h3>
                    <div class="crypto-row">
                        <div class="crypto-box"><i class="fa-brands fa-btc" style="color:#f59e0b"></i>BTC</div>
                        <div class="crypto-box"><i class="fa-solid fa-coins" style="color:#cbd5e1"></i>LTC</div>
                        <div class="crypto-box"><i class="fa-solid fa-paw" style="color:#eab308"></i>DOGE</div>
                        <div class="crypto-box"><i class="fa-solid fa-circle-nodes" style="color:#14b8a6"></i>SOL</div>
                    </div>
                    <div class="form-group">
                        <label>Amount ($ USD)</label>
                        <input id="deposit-amount" type="number" value="25" min="5">
                    </div>
                    <button onclick="triggerPayment()" class="btn-action" style="background:#fff; color:#000;">Generate Invoice</button>
                </div>
            </div>
        </div>

        <!-- VIEW 2: TOKEN CHECKER TOOL -->
        <div id="view-checker" class="view-panel">
            <div class="card" style="max-width: 800px;">
                <h3><i class="fa-solid fa-shield-halved"></i> Automated Token Checker</h3>
                <form id="checker-form" onsubmit="handleApiAction(event, '/api/items')">
                    <div class="form-group">
                        <label>Input Auth Tokens (One per line)</label>
                        <textarea placeholder="Paste accounts/tokens here..."></textarea>
                    </div>
                    <button type="submit" class="btn-action">Start Verification Scan</button>
                </form>
            </div>
        </div>

        <!-- VIEW 3: DISCORD BOOST TOOL -->
        <div id="view-booster" class="view-panel">
            <div class="card" style="max-width: 800px;">
                <h3><i class="fa-solid fa-rocket"></i> Server Booster Tool</h3>
                <form id="booster-form" onsubmit="handleApiAction(event, '/api/booster')">
                    <div class="form-group">
                        <label>Invite Link or Server ID</label>
                        <input type="text" placeholder="https://discord.gg">
                    </div>
