<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BoostLora | Premium Hub</title>
    
    <!-- Core Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <!-- Clerk Authentication SDK (Vanilla JS Setup) -->
    <!-- REPLACE 'your-clerk-publishable-key' with the actual key from ://clerk.com -->
    <script async crossorigin="anonymous" src="https://jsdelivr.net" 
            data-clerk-publishable-key="your-clerk-publishable-key" id="clerk-script"></script>

    <!-- Fail-Safe Premium Dark Dashboard Styling -->
    <style>
        :root {
            --bg-base: #060b13;
            --bg-card: #0d1527;
            --bg-input: #050811;
            --border-color: #1a2642;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-hover: #3b82f6;
            --accent-green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-h: 100vh;
            padding: 16px;
        }

        /* Top Navigation Header bar matches salta7 */
        header {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 1.1rem;
        }

        .logo-icon {
            color: var(--accent-blue);
        }

        /* Quick Action Sub-Nav Buttons */
        .nav-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-nav {
            background-color: #16223f;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-nav:hover {
            background-color: var(--border-color);
        }

        .btn-deposit {
            background-color: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--accent-green);
        }

        .btn-deposit:hover {
            background-color: rgba(16, 185, 129, 0.2);
        }

        .status-badge {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* Responsive Dashboard Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 2fr 1fr;
            }
        }

        /* Cards Styling matching the visual style */
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        /* Product/Booster Options Grid */
        .booster-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-top: 16px;
        }

        @media (min-width: 480px) {
            .booster-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .product-item {
            background: linear-gradient(135deg, #0f1930 0%, #0a1122 100%);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
        }

        .product-meta span {
            color: var(--accent-green);
        }

        /* Inputs & Interactive Buttons */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-blue);
        }

        .btn-primary {
            width: 100%;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        /* Crypto Payment Grid Layout */
        .crypto-selector {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .crypto-badge {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            padding: 12px 4px;
            border-radius: 8px;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
        }

        .crypto-badge i {
            display: block;
            font-size: 18px;
            margin-bottom: 4px;
        }

        .crypto-badge.btc:hover { border-color: #f59e0b; color: #f59e0b; }
        .crypto-badge.ltc:hover { border-color: #cbd5e1; color: #cbd5e1; }
        .crypto-badge.doge:hover { border-color: #eab308; color: #eab308; }
        .crypto-badge.sol:hover { border-color: #14b8a6; color: #14b8a6; }

        /* Statistics Footer Strip mimicking salta7 values */
        .stats-footer {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            text-align: center;
            border-top: 1px solid var(--border-color);
            padding-top: 24px;
        }

        .stat-val {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        .stat-lbl {
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            margin-top: 4px;
        }
    </style>
</head>
<body>

        <div class="logo-area">
            <i class="fa-solid fa-bolt logo-icon"></i>
            <span>BoostLora Hub</span>

        <div class="nav-actions">

            <div class="btn-nav"><i class="fa-solid fa-wallet"></i> 0 USD</div>

            <!-- Auth Anchors controlled by script below -->
            <div id="auth-buttons">

            </div>
            <div id="user-profile-slot"></div>

    <!-- Two-Column Layout Grid -->
    <div class="dashboard-grid">
        
        <!-- Left Side Dashboard Configuration -->
        <div style="display: flex; flex-direction: column; gap: 20px;">
            <div class="card">
                <div class="card-title">Welcome to your Operations Control Panel</div>

function triggerPayment() {
const amount = document.getElementById('deposit-amount').value;
if (window.Clerk && !window.Clerk.user) {
alert("Please log in first to safely assign crypto keys directly to your account profile ID block.");
window.Clerk.openSignIn();
return;
}
const userEmail = window.Clerk.user.primaryEmailAddress.emailAddress;
const userId = window.Clerk.user.id;
// Swap YOUR_CHECKOUT_ID out with your Coinbase Commerce setting key dashboard values
const commerceUrl = https://coinbase.com{amount}&custom=${userId}&email=${userEmail};
window.open(commerceUrl, '_blank', 'width=500,height=700,status=yes,resizable=yes');
}
window.addEventListener('load', async function() {
const script = document.getElementById('clerk-script');
script.addEventListener('load', async function() {
if (!window.Clerk) return;
await window.Clerk.load();
const authButtons = document.getElementById('auth-buttons');
const profileSlot = document.getElementById('user-profile-slot');
const signInBtn = document.getElementById('sign-in-btn');
if (window.Clerk.user) {
window.Clerk.mountUserButton(profileSlot, { appearance: { baseTheme: 'dark' } });
authButtons.style.display = 'none';
} else {
authButtons.style.display = 'block';
signInBtn.addEventListener('click', () => { window.Clerk.openSignIn(); });
}
});
});
